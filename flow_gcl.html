    <section id="about">
        <div class="about-container">


            <div class="grid">
                <div class="grid-card">
                    <div class="text">
                        <img src="assets/img/gcl.png" alt="Foto de Gustavo Kamakura">
                        <span>Water flow rate GCL vs CCL</span>
                        <p>Text</p>
                    </div>
                </div>
                <div class="grid-card">
                    <center>
                        <i class="fa-solid fa-calculator"></i>
                        <span>Compare the water flow rate coming from a GCL and CCL</span>
                        <form id="calculator" class="input-box">
                            <div class="input">
                                <label for="deep">Deep canal (m)</label>
                                <input type="text" id="deep">
                            </div>
                            <div class="input">
                                <label for="permeability_gcl">Permeability of the GCL (10<sup>-9</sup> m/s)</label>
                                <input type="text" id="permeability_gcl">
                            </div>
                            <div class="input">
                                <label for="thickness_gcl">Thickness GCL (mm)</label>
                                <input type="text" id="thickness_gcl">
                            </div>
                            <div class="input">
                                <label for="permeability_ccl">Permeability of the CCL (10<sup>-9</sup> m/s)</label>
                                <input type="text" id="permeability_ccl">
                            </div>
                            <div class="input">
                                <label for="thickness_ccl">Thickness CCL (mm)</label>
                                <input type="text" id="thickness_ccl">
                            </div>

                            <div class="btn-group">
                                <button type="submit" class="visit-btn">Compare GCL vs CCL</button>
                            </div>
                            <div><span id="results"></span></div>
                        </form>
                    </div>
                </center>
            </div>

        </div>
